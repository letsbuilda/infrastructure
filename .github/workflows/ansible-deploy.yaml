---
name: Deploy Ansible
on:
  # One converge a week instead of one per merge; dispatch to deploy sooner.
  schedule:
    - cron: 17 0 * * 0
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ansible-deploy
  cancel-in-progress: false
jobs:
  run-playbook:
    environment: ansible
    name: Run the playbook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true
      - name: Install dependencies
        run: uv sync --frozen --only-group ansible
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |-
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
      - name: Configure Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |-
          # install first so the file is never briefly world-readable, and
          # RUNNER_TEMP rather than HOME because the runner empties it at the
          # end of every job, leaving nothing to clean up.
          install -m 0600 /dev/null "$RUNNER_TEMP/vault_password"
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/vault_password"
      - name: Run ansible-playbook
        working-directory: ansible
        env:
          ANSIBLE_REMOTE_USER: ci
          ANSIBLE_BECOME_ASK_PASS: 'false'
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ runner.temp }}/vault_password
        run: uv run ansible-playbook --diff playbook.yaml
