---
name: Generate DNS change plan
on:
  pull_request:
    paths: [dns/production.yaml, dns/zones/**]
permissions:
  contents: read
# Superseded pushes to the same PR only waste the read-only token; cancel them.
concurrency:
  group: dns-dry-run-${{ github.ref }}
  cancel-in-progress: true
jobs:
  octodns-sync:
    name: Run `octodns-sync` with production.yaml
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.generate-plan.outputs.plan }}
      has_changes: ${{ steps.generate-plan.outputs.has_changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true
      - name: Install dependencies
        run: uv sync --frozen --only-group dns
      - name: Generate plan
        id: generate-plan
        env:
          # Read-only token, needed on every DNS PR; an environment gate with
          # required reviewers would defeat the automatic dry-run. See
          # docs/dns.md for the required token scope.
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_RO_TOKEN }}  # zizmor: ignore[secrets-outside-env]
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |-
          # octodns writes the rendered PlanMarkdown to stdout and its own logs
          # to stderr. Capture stdout as the plan, then echo it so the plan is
          # also visible in the job log for troubleshooting.
          plan="$(uv run octodns-sync --config-file=dns/production.yaml --force)"
          echo "$plan"
          # PlanMarkdown emits exactly this line when the plan is empty.
          # Deciding here, on the whole line, keeps a crafted record value from
          # spoofing the "no changes" signal that gates the PR comment.
          if grep -qxF '## No changes were planned' <<<"$plan"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          # Random delimiter so plan content (PR-controlled record values) can
          # never terminate the heredoc early and forge further step outputs.
          delimiter="OCTODNS_PLAN_$(openssl rand -hex 16)"
          {
            echo "plan<<${delimiter}"
            echo "$plan"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
  add-pr-comment:
    name: Add `octodns-sync` plan to comment
    if: ${{ needs.octodns-sync.outputs.has_changes == 'true' }}
    needs: [octodns-sync]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # `gh pr comment` creates/updates the plan comment
    steps:
      - name: Create or update comment
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.octodns-sync.outputs.plan }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |-
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --edit-last \
            --create-if-none \
            --body-file - <<EOF
          # OctoDNS Plan for \`$HEAD_REF\`
          $PLAN
          EOF
