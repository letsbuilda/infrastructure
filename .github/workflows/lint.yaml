---
name: Lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Superseded pushes to the same ref only waste runner minutes; cancel them.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - name: Sync dependencies
        run: uv sync
      - name: Run prek
        env:
          # Lets zizmor run its online audits (e.g. known-vulnerable-actions);
          # without a token it silently degrades to offline-only coverage.
          GH_TOKEN: ${{ github.token }}
        run: uv run prek run --all-files
  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - name: Sync dependencies
        run: uv sync --frozen --only-group ansible
      - name: Run ansible-lint
        working-directory: ansible
        run: uv run ansible-lint
      - name: Run playbook syntax check
        working-directory: ansible
        env:
          ANSIBLE_BECOME_ASK_PASS: 'false'
        run: uv run ansible-playbook --syntax-check playbook.yaml
