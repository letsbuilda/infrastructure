---
name: Deploy DNS to providers
on:
  push:
    branches: [main]
    paths: [dns/production.yaml, dns/zones/**]
  workflow_dispatch:
    inputs:
      force:
        description: Pass --force to octodns-sync, applying an unsafe plan
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dns-deploy
  cancel-in-progress: false
jobs:
  octodns-sync:
    environment: cloudflare
    name: Sync latest changes to DNS providers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true
      - name: Install dependencies
        run: uv sync --frozen --only-group dns
      - name: Sync DNS
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FORCE_SYNC: ${{ inputs.force }}
        run: |-
          args=(--config-file=dns/production.yaml --doit)
          if [[ "$FORCE_SYNC" == "true" ]]; then
            args+=(--force)
          fi
          uv run octodns-sync "${args[@]}"
