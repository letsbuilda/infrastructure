---
name: Deploy DNS to providers
on:
  push:
    branches: [main]
    paths: [dns/production.yaml, dns/zones/**]
permissions:
  contents: read
jobs:
  octodns-sync:
    environment: cloudflare
    name: Sync latest changes to DNS providers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true
      - name: Install dependencies
        run: uv sync --frozen --only-group dns
      - name: Sync DNS
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run octodns-sync --config-file=dns/production.yaml --doit --force
