---
name: Deploy DNS to providers
on:
  push:
    branches: [main]
    paths: [dns/production.yaml, dns/zones/**]
  workflow_dispatch:
    inputs:
      force:
        description: Pass --force to octodns-sync, applying an unsafe plan
        type: boolean
        default: false
# Checkout only; the DNS credentials come from the environment secrets.
permissions:
  contents: read
# Serialize applies so a slower run cannot clobber a newer one with a stale plan.
concurrency:
  group: dns-deploy
  cancel-in-progress: false
jobs:
  octodns-sync:
    environment: cloudflare
    name: Sync latest changes to DNS providers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true
      - name: Install dependencies
        run: uv sync --frozen --only-group dns
      - name: Sync DNS
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Boolean workflow_dispatch input; empty string on push events.
          FORCE_SYNC: ${{ inputs.force }}
        run: |-
          # Without --force, octodns refuses plans that update or delete >30%
          # of a zone's records. Re-run via workflow_dispatch with force=true
          # to apply an intentional bulk change.
          args=(--config-file=dns/production.yaml --doit)
          if [[ "$FORCE_SYNC" == "true" ]]; then
            args+=(--force)
          fi
          uv run octodns-sync "${args[@]}"
