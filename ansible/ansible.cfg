[defaults]
inventory = inventory/hosts.yaml
host_key_checking = True

[privilege_escalation]
become = yes
become_ask_pass = yes

[connection]
pipelining = True

[ssh_connection]
; Pin host verification to the repo's known_hosts (relative paths resolve
; because everything runs from this directory). Replacing ssh_args drops the
; defaults, so -C and the ControlMaster settings are restated here.
ssh_args = -C -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s
