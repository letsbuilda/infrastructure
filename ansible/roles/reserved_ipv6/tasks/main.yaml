---
- name: Install script dependencies
  ansible.builtin.apt:
    pkg: [curl, jq]
    state: latest
- name: Install the reserved IPv6 script
  ansible.builtin.copy:
    src: reserved-ipv6.sh
    dest: /usr/local/sbin/reserved-ipv6.sh
    owner: root
    group: root
    mode: '0755'
  notify: Re-run the reserved IPv6 script
- name: Install the reserved IPv6 systemd unit
  ansible.builtin.copy:
    src: reserved-ipv6.service
    dest: /etc/systemd/system/reserved-ipv6.service
    owner: root
    group: root
    mode: '0644'
  notify: Re-run the reserved IPv6 script
- name: Enable and start the reserved IPv6 unit
  ansible.builtin.systemd_service:
    name: reserved-ipv6.service
    daemon_reload: true
    enabled: true
    state: started
