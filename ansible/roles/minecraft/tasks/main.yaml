---
- name: Look up the letsbuilda account
  ansible.builtin.getent:
    database: passwd
    key: letsbuilda
- name: Create configuration directory
  ansible.builtin.file:
    path: /opt/letsbuilda/minecraft/
    state: directory
    owner: letsbuilda
    group: letsbuilda
    mode: '0700'
# Without this, a fresh host would get a root-owned bind-mount source from
# the docker daemon that the non-root container cannot write. Deliberately
# not recursive; the server manages its own files under data/.
- name: Create the data directory
  ansible.builtin.file:
    path: /opt/letsbuilda/minecraft/data
    state: directory
    owner: letsbuilda
    group: letsbuilda
    mode: '0750'
- name: Create the compose.yaml file
  ansible.builtin.copy:
    src: compose.yaml
    dest: /opt/letsbuilda/minecraft/compose.yaml
    owner: letsbuilda
    group: letsbuilda
    mode: '0600'
- name: Create the .env file
  ansible.builtin.copy:
    content: |
      MINECRAFT_UID={{ ansible_facts.getent_passwd['letsbuilda'][1] }}
      MINECRAFT_GID={{ ansible_facts.getent_passwd['letsbuilda'][2] }}
    dest: /opt/letsbuilda/minecraft/.env
    owner: letsbuilda
    group: letsbuilda
    mode: '0600'
- name: Run the containers
  community.docker.docker_compose_v2:
    project_src: /opt/letsbuilda/minecraft/
    remove_orphans: true
    pull: always
