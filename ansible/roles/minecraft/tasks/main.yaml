---
- name: Look up the letsbuilda account
  ansible.builtin.getent:
    database: passwd
    key: letsbuilda
- name: Create configuration directory
  ansible.builtin.file:
    path: /opt/letsbuilda/minecraft/
    state: directory
    owner: letsbuilda
    group: letsbuilda
    mode: '0700'
# Otherwise the daemon creates a root-owned dir the non-root container cannot write
- name: Create the data directory
  ansible.builtin.file:
    path: /opt/letsbuilda/minecraft/data
    state: directory
    owner: letsbuilda
    group: letsbuilda
    mode: '0750'
# A missing bind mount source becomes an empty root-owned dir; on a read-only
# mount that means the patch silently does not apply
- name: Create the patch definitions directory
  ansible.builtin.file:
    path: /opt/letsbuilda/minecraft/patches
    state: directory
    owner: letsbuilda
    group: letsbuilda
    mode: '0750'
- name: Create the compose.yaml file
  ansible.builtin.copy:
    src: compose.yaml
    dest: /opt/letsbuilda/minecraft/compose.yaml
    owner: letsbuilda
    group: letsbuilda
    mode: '0600'
# Without ProtocolLib, Spigot writes "<player> issued server command:
# /login <password>" into logs/latest.log in the clear. ProtocolLib is not on
# Modrinth and has no 26.2 release, so player command logging goes off instead.
# Definitions must be .json: with PATCH_DEFINITIONS naming a directory,
# mc-image-helper enumerates *.json only and reads each file as a bare patch
# definition rather than a patch set. A .yaml file is skipped silently and the
# run still exits 0, so the patch looks applied when it never was.
- name: Create the spigot.yml patch definition
  ansible.builtin.copy:
    src: patches/spigot.json
    dest: /opt/letsbuilda/minecraft/patches/spigot.json
    owner: letsbuilda
    group: letsbuilda
    mode: '0600'
# The .yaml form was never applied; drop it so it cannot be mistaken for a
# working patch. Safe to remove from this role once the host has converged.
- name: Remove the superseded YAML patch definition
  ansible.builtin.file:
    path: /opt/letsbuilda/minecraft/patches/spigot.yaml
    state: absent
- name: Create the .env file
  ansible.builtin.copy:
    content: |
      MINECRAFT_UID={{ ansible_facts.getent_passwd['letsbuilda'][1] }}
      MINECRAFT_GID={{ ansible_facts.getent_passwd['letsbuilda'][2] }}
    dest: /opt/letsbuilda/minecraft/.env
    owner: letsbuilda
    group: letsbuilda
    mode: '0600'
- name: Run the containers
  community.docker.docker_compose_v2:
    project_src: /opt/letsbuilda/minecraft/
    remove_orphans: true
    pull: always
