services:
  minecraft:
    image: itzg/minecraft-server:2026.9.1@sha256:e8640538dac5d54c2838d57fa9641e735ad0cf2b71fb0e8a68da3b542a315749
    tty: true
    stdin_open: true
    user: "${MINECRAFT_UID:?}:${MINECRAFT_GID:?}"
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Ceilings above the 4 GiB JVM heap (MEMORY below), so the JVM hits its limit first
    mem_limit: 6g
    mem_reservation: 4g
    pids_limit: 512
    ports:
      - "25565:25565"
    environment:
      VERSION: "26.2"
      EULA: "TRUE"
      TYPE: "PAPER"
      DIFFICULTY: "hard"
      # Nothing verifies the username a client claims; SimpleLogin (below) is
      # what actually authenticates players
      ONLINE_MODE: "false"
      MEMORY: "4096M"
      MOTD: "Pet your local wolf!"
      # Offline UUID for Shenanigander. With ONLINE_MODE off the server derives
      # UUIDs from md5("OfflinePlayer:<name>") instead of Mojang account IDs, so
      # a username here would resolve to a premium UUID that never matches.
      OPS: |
        f80b6217-80b9-395e-b939-6c4aababbfdd
      EXISTING_OPS_FILE: SYNCHRONIZE
      # Resolved against VERSION and the Paper loader on every start, newest
      # release only. Left unpinned deliberately: Dependabot only understands
      # image: lines, so a pinned plugin would go stale with nothing to bump it.
      # No "?" suffix — if no compatible build exists the container must fail
      # rather than come up with nothing authenticating players. VERSION is
      # pinned, so these resolve against a fixed game version rather than
      # drifting with each Minecraft release.
      MODRINTH_PROJECTS: |
        simple-login
        discordsrv
      # SimpleLogin soft-depends on ProtocolLib only to keep passwords out of
      # the log, and ProtocolLib has no 26.2 release; the patch turns off
      # spigot.yml's commands.log instead, which would otherwise record the
      # /login line in the clear.
      PATCH_DEFINITIONS: "/patches"
      # DiscordSRV reads System.getenv("DISCORDSRV_TOKEN") before it falls back
      # to BotToken in config.yml, so the token never lands in the data volume
      # and never reaches a /discord debug upload. Ansible writes it into .env
      # from the vault. The name is deliberately not CFG_-prefixed:
      # REPLACE_ENV_VARIABLE_PREFIX defaults to CFG_, so this value is not
      # eligible for interpolation into any file under /data.
      DISCORDSRV_TOKEN: "${DISCORDSRV_TOKEN:?}"
      # Re-applied on every start rather than set once by hand, so the gamerule
      # cannot drift out of the repo. RCON is enabled by default with a
      # generated password on 25575, which is not published.
      RCON_CMDS_STARTUP: |-
        gamerule players_sleeping_percentage 0
    volumes:
      - "./data:/data"
      - "./patches:/patches:ro"
