services:
  minecraft:
    image: itzg/minecraft-server:2026.8.2@sha256:efa878ddb49cf5251b2e5f2ad71b08fd2f7236c1f7907433f6697258b31d2ce4
    tty: true
    stdin_open: true
    user: "${MINECRAFT_UID:?}:${MINECRAFT_GID:?}"
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Cgroup ceilings above the fixed 4 GiB JVM heap (MEMORY below), so the
    # JVM hits its own limit before the kernel OOM killer gets involved.
    mem_limit: 6g
    mem_reservation: 4g
    pids_limit: 512
    ports:
      - "25565:25565"
    environment:
      VERSION: "26.2"
      EULA: "TRUE"
      TYPE: "FABRIC"
      DIFFICULTY: "hard"
      MEMORY: "4096M"
      MOTD: "Pet your local wolf!"
      OPS: |
        Shenanigander
      EXISTING_OPS_FILE: SYNCHRONIZE
    volumes:
      - "./data:/data"
