services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      VERSION: "26.2"
      EULA: "TRUE"
      TYPE: "FABRIC"
      DIFFICULTY: "hard"
      MEMORY: "4096M"
      MOTD: "Pet your local wolf!"
    volumes:
      - "./data:/data"
