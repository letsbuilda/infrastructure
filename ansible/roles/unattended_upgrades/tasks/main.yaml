---
- name: Install unattended-upgrades and needrestart
  ansible.builtin.apt:
    pkg: [unattended-upgrades, needrestart]
    state: latest
- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
- name: Configure unattended upgrades
  ansible.builtin.copy:
    src: 52unattended-upgrades-local
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: '0644'
- name: Restart services automatically after library upgrades
  ansible.builtin.copy:
    src: 50-autorestart.conf
    dest: /etc/needrestart/conf.d/50-autorestart.conf
    owner: root
    group: root
    mode: '0644'
- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: unattended_upgrades_reboot_required
- name: Surface a pending kernel reboot
  ansible.builtin.debug:
    msg: A reboot is required to finish applying updates.
  when: unattended_upgrades_reboot_required.stat.exists
